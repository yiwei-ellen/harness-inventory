name: Shadow agent report
description: Report an agent, MCP server, or harness that couldn't be identified automatically
title: "[shadow-agent] "
labels: ["shadow-agent", "needs-id"]
body:
  - type: input
    id: fingerprint_hash
    attributes:
      label: Fingerprint hash (auto-filled)
    validations:
      required: true
  - type: input
    id: match_path
    attributes:
      label: Path pattern (auto-filled)
    validations:
      required: false
  - type: input
    id: match_bundle_id
    attributes:
      label: Bundle ID (auto-filled, if any)
    validations:
      required: false
  - type: input
    id: install_method
    attributes:
      label: Install method (auto-filled)
    validations:
      required: false
  - type: input
    id: signing_status
    attributes:
      label: Signing status / publisher (auto-filled)
    validations:
      required: false
  - type: input
    id: first_seen
    attributes:
      label: First seen (auto-filled)
    validations:
      required: false
  - type: textarea
    id: anything_known
    attributes:
      label: Anything you happen to know? (optional)
    validations:
      required: false
